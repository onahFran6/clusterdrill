name: Documentation issue
description: Something in the README, CONTRIBUTING guide, or other docs is missing, unclear, or wrong
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File or section
      description: e.g. README.md's Quick start, CONTRIBUTING.md's Verify before opening a PR
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's missing, unclear, or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional - if you already know what it should say instead.
    validations:
      required: false
