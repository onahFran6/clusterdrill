name: release-image

# Triggered via workflow_dispatch from release-please.yml once it creates
# a release - NOT via `on: push: tags`, because release-please-action
# pushes that tag using the default GITHUB_TOKEN, and GitHub explicitly
# does not let GITHUB_TOKEN-authored pushes cascade into triggering other
# workflows (loop-prevention safeguard; workflow_dispatch/repository_dispatch
# are the documented exceptions). Builds and pushes the real multi-arch
# image and the paired OCI Helm chart, attaches the wheel to the GitHub
# Release, and opens a PR (never a direct push) recording the published
# digest/chart defaults back into the source tree for the next `git
# clone` to see.
#
# Can also be dispatched manually against any branch/tag combination to
# test the build/push mechanics before a real release - e.g. `gh workflow
# run release-image.yml --ref dev -f tag=v0.0.0-test1`. Image and chart
# always get built and pushed for real either way; the wheel-upload and
# manifest-update-PR steps automatically skip themselves when the given
# tag has no matching GitHub Release, so a test dispatch can't leave a
# stray PR or a bogus release_manifest.json entry behind.
#
# Third-party Actions pinned to a full commit SHA, not a mutable tag,
# matching pr-quality-gate.yml's existing convention - the trailing `# vX`
# comment is only a human-readable label. To bump: `gh api
# repos/<owner>/<repo>/git/refs/tags/<new-tag> --jq .object.sha` (resolve
# through .object again if that returns a tag object, not a commit).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      release_exists: ${{ steps.check_release.outputs.release_exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Lets this workflow be dispatched against a throwaway tag on any
      # branch (e.g. testing the build/push mechanics on dev) without
      # requiring a real GitHub Release to exist first - image/chart
      # always get built and pushed for real, but the wheel-upload and
      # manifest-update-PR steps below only run when this tag corresponds
      # to an actual release, never for a test dispatch.
      - id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # qemu registers arm64 emulation; buildx alone can't emulate on an
      # amd64-only ubuntu-latest runner - qemu must come first, or the
      # arm64 leg of the build below fails outright.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/w00dson/clusterdrill:${{ steps.version.outputs.version }}

  package-and-push-chart:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Patches Chart.yaml's version/appVersion and values.yaml's
      # image.repository/image.digest directly in this checkout, so the
      # published chart needs zero --set image.* flags for the common
      # case. Regex, not a full yaml.safe_load/dump round-trip, to
      # preserve values.yaml's existing comments.
      - name: Patch Chart.yaml and values.yaml for this release
        env:
          VERSION: ${{ needs.build-and-push-image.outputs.version }}
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          digest = os.environ["DIGEST"]
          chart_dir = Path("clusterdrill/helm/clusterdrill-chart")

          chart_path = chart_dir / "Chart.yaml"
          text = chart_path.read_text()
          text = re.sub(r"^version:.*$", f"version: {version}", text, count=1, flags=re.MULTILINE)
          text = re.sub(r"^appVersion:.*$", f'appVersion: "{version}"', text, count=1, flags=re.MULTILINE)
          chart_path.write_text(text)

          values_path = chart_dir / "values.yaml"
          text = values_path.read_text()
          text = re.sub(
              r'^(\s*repository:\s*).*$',
              r'\1"docker.io/w00dson/clusterdrill"',
              text, count=1, flags=re.MULTILINE,
          )
          text = re.sub(
              r'^(\s*digest:\s*).*$',
              rf'\1"{digest}"',
              text, count=1, flags=re.MULTILINE,
          )
          values_path.write_text(text)
          PY

      - name: Package and push chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p /tmp/chart-out
          helm package clusterdrill/helm/clusterdrill-chart --destination /tmp/chart-out
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          helm push /tmp/chart-out/clusterdrill-chart-*.tgz oci://registry-1.docker.io/w00dson

  build-and-upload-wheel:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Attach wheel to the release-please-created GitHub Release
        if: ${{ needs.build-and-push-image.outputs.release_exists == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/*.whl
      - name: Skip wheel upload (no matching GitHub Release for this tag)
        if: ${{ needs.build-and-push-image.outputs.release_exists != 'true' }}
        run: echo "No GitHub Release found for tag '${{ inputs.tag }}' - skipping wheel upload (this looks like a test/dry-run dispatch, not a real release)."

  # Records the published digest and chart defaults back into the source
  # tree - opens a PR against main rather than pushing directly, so a
  # human reviews/merges it. The image and chart are already live on
  # Docker Hub by the time this PR exists; nothing above waits on its
  # merge. Skipped entirely for a test/dry-run dispatch (no matching
  # GitHub Release) - a throwaway test tag has no business landing in
  # release_manifest.json or spawning a real PR against main.
  open-manifest-update-pr:
    needs: build-and-push-image
    if: ${{ needs.build-and-push-image.outputs.release_exists == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Record the published digest and chart defaults
        env:
          VERSION: ${{ needs.build-and-push-image.outputs.version }}
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          digest = os.environ["DIGEST"]

          manifest_path = Path("clusterdrill/release_manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["digests"][version] = digest
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          values_path = Path("clusterdrill/helm/clusterdrill-chart/values.yaml")
          text = values_path.read_text()
          text = re.sub(
              r'^(\s*repository:\s*).*$',
              r'\1"docker.io/w00dson/clusterdrill"',
              text, count=1, flags=re.MULTILINE,
          )
          text = re.sub(
              r'^(\s*digest:\s*).*$',
              rf'\1"{digest}"',
              text, count=1, flags=re.MULTILINE,
          )
          values_path.write_text(text)
          PY

      - name: Open PR against main
        env:
          VERSION: ${{ needs.build-and-push-image.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/record-${VERSION}-digest"
          git checkout -b "$BRANCH"
          git add clusterdrill/release_manifest.json clusterdrill/helm/clusterdrill-chart/values.yaml
          git commit -m "chore: record published image digest for ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: record published image digest for ${VERSION}" \
            --body "Records the image digest and chart defaults published by \`release-image.yml\` for ${VERSION}. The image and chart are already live on Docker Hub - this just updates the source tree to match."
