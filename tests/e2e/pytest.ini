[pytest]
# Real browser-level E2E, not the fast/hermetic web/tests or
# clusterdrill/tests suites - deliberately its own testpaths/rootdir so a
# plain `pytest` run elsewhere in the repo never sweeps this in. Run
# explicitly from this directory (after `pip install -r requirements.txt`
# and `playwright install chromium`):
#   python -m pytest -q
testpaths = .
