extends: default

# Applies to the rendered Kubernetes manifest templates under
# clusterdrill/manifests/. These are hand-authored multi-document files
# (no leading "---" needed on the first document) using the common
# 0-indent "- key:" sequence style k8s manifests conventionally use, and
# RBAC rules legitimately put a long apiGroups/resources array on one
# line rather than wrapping it - wrapping would fight kubectl's own
# formatting conventions for no readability gain.
rules:
  document-start: disable
  indentation:
    indent-sequences: consistent
  line-length: disable
