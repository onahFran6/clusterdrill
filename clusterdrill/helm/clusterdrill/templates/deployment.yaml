apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterdrill-web
  namespace: clusterdrill-system
  labels:
    {{- include "clusterdrill.labels" . | nindent 4 }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  # Only name+instance in the selector - immutable after creation, so
  # nothing that legitimately changes release to release (version) may be
  # in it. Matches the raw manifest's own selector exactly - see
  # docs/adr/0002-kubernetes-metadata-conventions.md.
  selector:
    matchLabels:
      {{- include "clusterdrill.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clusterdrill.labels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: clusterdrill-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: {{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: CLUSTERDRILL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ required "auth.existingSecretName is required" .Values.auth.existingSecretName }}
              key: password
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
        volumeMounts:
        - name: home
          mountPath: /home/clusterdrill
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: home
        emptyDir: {}
      - name: tmp
        emptyDir: {}
